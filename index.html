<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>PLU-Helfer Loader</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>⚡ PLU-Helfer wird geladen...</h2>
    <p>Du wirst gleich weitergeleitet.</p>
    <script>
        // Hier wird dein echtes Skript direkt von GitHub nachgeladen
        const script = document.createElement('script');
        script.src = 'https://raw.githubusercontent.com/Hyxlonka/jup/main/Easy.txt';
        script.onload = function() {
            document.body.innerHTML = '<h2>✅ Geladen! Du kannst dieses Fenster schließen oder zurückgehen.</h2>';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
